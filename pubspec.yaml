name: lifelens
description: Biological Age Estimator MVP
publish_to: 'none'
version: 2.1.1+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.12.0
  shared_preferences: ^2.5.5
  tflite_flutter: ^0.11.0
  image: ^4.1.3
  fl_chart: ^0.69.0
  share_plus: ^7.2.1  # ✅ ДОБАВЬ ЭТУ СТРОКУ

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1  # ✅ Добавил в dev_dependencies

flutter:
  uses-material-design: true
  assets:
    - assets/models/model_age_nonq.tflite
    - assets/models/model_gender_nonq.tflite
    - assets/image/

flutter_launcher_icons:  # ✅ БЕЗ ОТСТУПА — отдельный блок верхнего уровня
  android: true
  ios: true
  image_path: "assets/image/logo.png"
  adaptive_icon_foreground: "assets/image/logo.png"
  adaptive_icon_background: "#0F1115"